function calc(e){if(e.h)return e.h;const incAmt=incOn(e)?Math.round(e.last*S.inc/100):0,g=e.last+incAmt,basic=Math.ceil(g*S.basic/100),hr=Math.round(g*S.hr/100),med=Math.round(g*S.med/100),tr=g-basic-hr-med,

function slip(){return`<div class="noprint" style="display:flex;gap:6px"><select onchange="sel=+this.value;render()">${E.map((x,i)=>`<option value="${i}" ${i==sel?"selected":""}>${i+1}. ${x.name}</option>`).join("")}</select><button class="btn g" style="margin:0;white-space:nowrap" onclick="all=!all;render()">${all?"Single":"All slips"}</button></div><div style="margin-top:10px">${all?E.map(one).join(""):one(E[sel])}</div>${PB}`}
function bankFor(L,lab){const g={};L.forEach(e=>{const k=(lab&&lab!="All")?"all":e.bank.slice(0,7);(g[k]=g[k]||[]).push([e,calc(e).net])});

function topFor(L,lab){const g={};L.forEach(e=>{const c=calc(e),k=(e.code||"—")+"|"+e.des,x=g[k]=g[k]||{n:0,g:0,sf:0,t:0,net:0};x.n++;x.g+=c.g;x.sf+=c.sf;x.t+=c.tax;x.net+=c.net});
const ks=Object.keys(g).sort();return`<div class="card pb">${hdr("Top Sheet",lab)}<div class="wrap" style="margin-top:8px"><table><thead><tr><th>#</th><th>Code / Post</th><th>Staff</th><th>Gross</th><th>Sec. fund</th><th>Tax</th><th>Net</th></tr></thead><tbody>${ks.map((k,i)=>{const x=g[k];return`<tr><td>${i+1}</td><td>${k.replace("|"," ")}</td><td>${x.n}</td><td>${f(x.g)}</td><td>${f(x.sf)}</td><td>${f(x.t)}</td><td>${f(x.net)}</td></tr>`}).join("")}</tbody><tfoot><tr><td></td><td>Total</td><td>${L.length}</td>${["g","sf","tax","net"].map(k=>`<td>${f(L.reduce((a,e)=>a+calc(e)[k],0))}</td>`).join("")}</tr></tfoot></table></div>${sg}</div>`}

function tdsBox(g){const A=g*12,ex=Math.min(A/3,S.cap),ti=A-ex,st=ti>S.thr?Math.max(0,slabTax(ti)-ti*S.reb/100):0;return`<div style="color:var(--mu);font-size:11.5px;margin-top:8px">TDS basis (Sec. 86): annual gross ${f(A)} − exemption ${f(ex)} = taxable ${f(ti)}; slab tax ${f(st)}${ti>S.thr?"; minimum "+f(S.minTax):""} → ${f(tds(g))}/month</div>`}
function slabTax(t){const B=[[300000,.1],[400000,.15],[500000,.2],[2000000,.25],[1e15,.3]];let x=Math.max(0,t-S.thr),r=0;for(const[w,p]of B){const a=Math.min(x,w);r+=a*p;x-=a;if(x<=0)break}return r}
function tds(g){const A=g*12,ex=Math.min(A/3,S.cap),ti=A-ex;if(ti<=S.thr)return 0;let t=slabTax(ti)-ti*S.reb/100;t=Math.max(t,S.minTax);return Math.round(t/12)}
function taxOf(e,g){return(S.tdsAuto&&!e.tm)?tds(g):(+e.tax||0)}
